name: repro

# Runs each integration test as its own job so every outcome is visible.
# Expected outcome at the pinned master revision (.fvmrc):
#
#   text_input_test.dart         windows: FAIL (PlatformException, view_id=1)   linux: pass
#   native_owner_test.dart       windows: FAIL (app dies at owner swap)          linux: FAIL (segfault)
#   control/..._test.dart        windows: pass                                   linux: pass
#
# Linux runs on Wayland, in a headless Weston. Not Xvfb: there a second native
# Flutter window dies with a GLX BadAccess even outside any test.

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.test }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        test:
          - integration_test/text_input_test.dart
          - integration_test/native_owner_test.dart
          - integration_test/control/native_window_with_real_engine_id_test.dart
    steps:
      - uses: actions/checkout@v4

      # A master pin makes flutter-action clone flutter/flutter, which has
      # paths beyond Windows' MAX_PATH.
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev weston

      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter config --enable-windowing
      - run: flutter --version
      - run: flutter pub get

      - name: flutter test (Windows)
        if: runner.os == 'Windows'
        run: flutter test ${{ matrix.test }} -d windows

      - name: flutter test (Linux, headless Wayland)
        if: runner.os == 'Linux'
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --width=1920 --height=1080 \
            --socket=wayland-repro --idle-time=0 &> weston.log &
          for _ in $(seq 50); do
            [ -S "$XDG_RUNTIME_DIR/wayland-repro" ] && break
            sleep 0.2
          done
          env -u DISPLAY WAYLAND_DISPLAY=wayland-repro GDK_BACKEND=wayland \
            flutter test ${{ matrix.test }} -d linux

      - name: weston log
        if: always() && runner.os == 'Linux'
        run: cat weston.log || true
